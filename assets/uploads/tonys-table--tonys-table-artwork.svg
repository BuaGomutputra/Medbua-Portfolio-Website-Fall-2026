<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Tony’s Table — Duolingo poker lesson concept</title><desc id="desc">Tony, the supplied poker-teacher character, beside the title Tony’s Table.</desc><rect width="1600" height="1000" fill="#f2f3e9"/><circle cx="1250" cy="440" r="310" fill="#e3e8d7"/><g fill="none" stroke="#c3cbb4" stroke-width="2"><ellipse cx="1250" cy="440" rx="360" ry="320"/><ellipse cx="1250" cy="440" rx="390" ry="345"/></g><text x="105" y="120" font-family="Arial,sans-serif" font-size="22" letter-spacing="5" fill="#606a51">DUOLINGO × IOVINE AND YOUNG</text><text x="95" y="350" font-family="Georgia,serif" font-size="178" fill="#303a28">Tony’s</text><text x="95" y="535" font-family="Georgia,serif" font-size="178" fill="#303a28">Table.</text><text x="105" y="640" font-family="Arial,sans-serif" font-size="34" fill="#606a51">A poker teacher with the perfect poker face.</text><g transform="translate(1010 115) scale(.83)">
  
  

